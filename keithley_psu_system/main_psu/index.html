<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main PSU</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
        }

        h1 { margin-bottom: 5px; }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-indicator.connected {
            background: #22c55e;
        }

        .measurement-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #1f2937;
            border-radius: 12px;
            padding: 30px;
        }

        .label {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .value {
            font-size: 46px;
            font-weight: bold;
        }

        .unit {
            font-size: 22px;
            color: #9ca3af;
            margin-left: 5px;
        }

        .info {
            margin-top: 25px;
            background: #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        .info-row { margin-bottom: 10px; }
        .info-label { color: #9ca3af; }

        #error {
            color: #f87171;
            margin-top: 15px;
        }

        @media (max-width: 650px) {
            .measurement-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Main Power Supply</h1>
    <div class="subtitle">Live Keithley telemetry</div>

    <div class="status-row">
        <div id="statusIndicator" class="status-indicator"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <div class="measurement-grid">

        <div class="card">
            <div class="label">Measured Voltage</div>
            <div>
                <span id="voltage" class="value">--</span>
                <span class="unit">V</span>
            </div>
        </div>

        <div class="card">
            <div class="label">Measured Current</div>
            <div>
                <span id="current" class="value">--</span>
                <span class="unit">A</span>
            </div>
        </div>

    </div>

    <div class="info">
        <div class="info-row">
            <span class="info-label">Instrument:</span>
            <span id="idn">--</span>
        </div>

        <div class="info-row">
            <span class="info-label">Last measurement:</span>
            <span id="timestamp">--</span>
        </div>

        <div id="error"></div>
    </div>

</div>

<script>
    let socket;

    function connectWebSocket() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const websocketURL = `${protocol}//${location.host}/ws`;

        socket = new WebSocket(websocketURL);

        socket.onopen = function () {
            console.log("WebSocket connected");
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            updateInterface(data);
        };

        socket.onclose = function () {
            document.getElementById("statusIndicator")
                .classList.remove("connected");

            document.getElementById("statusText").textContent =
                "Server disconnected";

            setTimeout(connectWebSocket, 2000);
        };

        socket.onerror = function () {
            socket.close();
        };
    }

    function updateInterface(data) {
        const statusIndicator =
            document.getElementById("statusIndicator");

        const statusText =
            document.getElementById("statusText");

        if (data.connected) {
            statusIndicator.classList.add("connected");
            statusText.textContent = "Connected";
        } else {
            statusIndicator.classList.remove("connected");
            statusText.textContent = "Instrument disconnected";
        }

        if (data.voltage !== null) {
            document.getElementById("voltage").textContent =
                Number(data.voltage).toFixed(4);
        }

        if (data.current !== null) {
            document.getElementById("current").textContent =
                Number(data.current).toFixed(4);
        }

        document.getElementById("idn").textContent =
            data.idn || "--";

        document.getElementById("timestamp").textContent =
            data.timestamp || "--";

        document.getElementById("error").textContent =
            data.error ? `Error: ${data.error}` : "";
    }

    connectWebSocket();
</script>

</body>
</html>
